<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="./asset/8232913-200.png" type="image/x-icon">
    <title>Purivo</title>
</head>
<body>

    <header>
        <nav>
            <div class="red">

                <div class="item">
                    <img src="./asset/8232913-200.png" alt="Purivo Logo">
                    <h1>Purivo</h1>
                </div>

                <!-- Hamburger button (mobile only) -->
                <button class="menu-toggle" id="menu-toggle" aria-label="Toggle menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>

                <div class="item1" id="nav-links">
                    <a href="index.html">Home</a>
                    <a href="booking.html">Booking</a>
                    <a href="Contact.html">Contact us</a>
                    <a href="login.html">Login</a>
                    <a href="admin.html">Admin</a>
                </div>

            </div>
        </nav>
    </header>

    <main>
        <div class="item-2">
            <h2>Professional <br><span class="red-text">Cleaning Services</span><br> in Abuja</h2>
            <hr>
            <p class="item-1-1">We Make Your Space Sparkle</p>
            <p class="item-1-2">Reliable, affordable and thorough cleaning solutions <br>for your homes and offices.</p>
            <a href="booking.html"><button class="item-1-3">Book Now</button></a>
        </div>
    </main>

    <script>
        // Hamburger toggle
        document.getElementById('menu-toggle').addEventListener('click', function() {
            document.getElementById('nav-links').classList.toggle('open');
        });

        // Close menu when a link is clicked
        document.querySelectorAll('.item1 a').forEach(function(link) {
            link.addEventListener('click', function() {
                document.getElementById('nav-links').classList.remove('open');
            });
        });
    </script>

</body>
</html>
